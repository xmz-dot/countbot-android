name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace > /tmp/debug.log 2>&1
        echo "EXIT_CODE=$?"
        tail -100 /tmp/debug.log

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --stacktrace > /tmp/release.log 2>&1
        echo "EXIT_CODE=$?"
        tail -100 /tmp/release.log

    - name: Check build results
      run: |
        echo "=== Debug build exit code ==="
        grep 'EXIT_CODE' /tmp/debug.log || echo 'No exit code found'
        echo "=== Release build exit code ==="
        grep 'EXIT_CODE' /tmp/release.log || echo 'No exit code found'
        echo "=== APK search ==="
        find $GITHUB_WORKSPACE -name '*.apk' 2>/dev/null || echo 'NO APK FOUND'

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /tmp/*.log
        retention-days: 7
