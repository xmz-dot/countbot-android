name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -200

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -200

    - name: Debug APK paths
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "PWD=$(pwd)"
        find $GITHUB_WORKSPACE/app/build -name '*.apk' -type f 2>/dev/null
        ls -la $GITHUB_WORKSPACE/app/build/outputs/apk/ 2>/dev/null || echo 'No apk dir'

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CountBot-Debug
        path: ${{ github.workspace }}/app/build/outputs/apk/debug/
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: CountBot-Release
        path: ${{ github.workspace }}/app/build/outputs/apk/release/
        retention-days: 30
