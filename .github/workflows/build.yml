name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure SDK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ANDROID_HOME=$ANDROID_HOME" >> local.properties
        cat local.properties

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        echo "=== Starting assembleDebug ==="
        echo "JAVA_HOME=$JAVA_HOME"
        java -version 2>&1
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "=== local.properties ==="
        cat local.properties
        echo "=== Starting Gradle ==="
        ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log
        EXIT=${PIPESTATUS[0]}
        echo "=== Gradle exit code: $EXIT ==="
        if [ $EXIT -ne 0 ]; then
          echo "=== Last 100 lines of build log ==="
          tail -100 /tmp/build.log
          exit $EXIT
        fi

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --stacktrace 2>&1 | tee -a /tmp/build.log
        exit ${PIPESTATUS[0]}

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: countbot-apks
        path: app/build/outputs/apk/
        if-no-files-found: error
        retention-days: 30
