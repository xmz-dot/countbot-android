name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set +e
        ./gradlew assembleDebug --stacktrace > /tmp/debug-build.log 2>&1
        EXIT=$?
        echo "Gradle exit code: $EXIT"
        tail -50 /tmp/debug-build.log
        set -e
        if [ $EXIT -ne 0 ]; then exit $EXIT; fi

    - name: Build Release APK
      run: |
        set +e
        ./gradlew assembleRelease --stacktrace > /tmp/release-build.log 2>&1
        EXIT=$?
        echo "Gradle exit code: $EXIT"
        tail -50 /tmp/release-build.log
        set -e
        if [ $EXIT -ne 0 ]; then exit $EXIT; fi

    - name: Verify APK files exist
      run: |
        echo "=== Full APK search ==="
        find $GITHUB_WORKSPACE -name '*.apk' -type f 2>/dev/null
        echo "=== Standard output paths ==="
        ls -laR $GITHUB_WORKSPACE/app/build/outputs/apk/ 2>/dev/null || echo 'No apk output dir'
        echo "=== Build dir structure ==="
        ls -la $GITHUB_WORKSPACE/app/build/ 2>/dev/null || echo 'No build dir'

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: CountBot-Debug
        path: app/build/outputs/apk/debug/
        if-no-files-found: error
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: CountBot-Release
        path: app/build/outputs/apk/release/
        if-no-files-found: error
        retention-days: 30
