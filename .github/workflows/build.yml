name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build-debug.log
      continue-on-error: true

    - name: Show build log on failure
      if: failure()
      run: tail -100 /tmp/build-debug.log

    - name: Build Release APK
      if: success()
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build-release.log

    - name: Show APK files
      if: success()
      run: ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CountBot-Debug-v0.9.0
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CountBot-Release-v0.9.0
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: /tmp/build-*.log
        retention-days: 3
