name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -200

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -200

    - name: Prepare APK artifacts
      run: |
        mkdir -p /tmp/apk-output
        find . -name '*.apk' -type f -exec cp {} /tmp/apk-output/ \;
        echo "=== APK files ==="
        ls -lh /tmp/apk-output/

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: CountBot-APKs
        path: /tmp/apk-output/*.apk
        if-no-files-found: error
        retention-days: 30
