name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -200

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -200

    - name: Collect APK info
      run: |
        echo "=== APK search results ===" > /tmp/apk-info.txt
        find $GITHUB_WORKSPACE -name '*.apk' -type f 2>/dev/null >> /tmp/apk-info.txt || echo 'NO APK FOUND' >> /tmp/apk-info.txt
        echo "" >> /tmp/apk-info.txt
        echo "=== app/build/outputs ===" >> /tmp/apk-info.txt
        ls -laR $GITHUB_WORKSPACE/app/build/outputs/ 2>/dev/null >> /tmp/apk-info.txt || echo 'No outputs dir' >> /tmp/apk-info.txt
        echo "" >> /tmp/apk-info.txt
        echo "=== Gradle build directory ===" >> /tmp/apk-info.txt
        ls -la $GITHUB_WORKSPACE/app/build/ 2>/dev/null >> /tmp/apk-info.txt || echo 'No build dir' >> /tmp/apk-info.txt
        cat /tmp/apk-info.txt

    - name: Upload APK info
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug-info
        path: /tmp/apk-info.txt
        retention-days: 7

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: countbot-apks
        path: app/build/outputs/apk/
        retention-days: 30
