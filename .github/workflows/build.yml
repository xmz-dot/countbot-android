name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      continue-on-error: true
      run: |
        echo "=== Starting Gradle build ==="
        echo "JAVA_HOME=$JAVA_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        java -version
        echo "=== SDK contents ==="
        ls -la $ANDROID_HOME/ 2>/dev/null || echo 'ANDROID_HOME not found'
        echo "=== local.properties ==="
        cat local.properties 2>/dev/null || echo 'No local.properties'
        echo "=== Starting assembleDebug ==="
        ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log
        echo "=== Build finished with exit code: ${PIPESTATUS[0]} ==="
        echo "=== Searching for APK ==="
        find . -name '*.apk' -type f 2>/dev/null || echo 'No APK found'

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: debug-build-log
        path: /tmp/build.log
        retention-days: 7
