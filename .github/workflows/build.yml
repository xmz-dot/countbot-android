name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: |
        set +e
        ./gradlew assembleRelease > $RUNNER_TEMP/build.log 2>&1
        BUILD_EXIT=$?
        echo "Gradle exit code: $BUILD_EXIT"
        set -e
        exit $BUILD_EXIT

    - name: List APK output
      run: |
        echo "=== ls -R app/build/outputs/ ==="
        ls -R app/build/outputs/ 2>/dev/null || echo 'No outputs dir'
        echo "=== find all APK ==="
        find $GITHUB_WORKSPACE -name '*.apk' -type f 2>/dev/null || echo 'NO APK FOUND'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: countbot-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
