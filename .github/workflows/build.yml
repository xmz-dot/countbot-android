name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set +e
        ./gradlew assembleDebug --stacktrace > $RUNNER_TEMP/debug-build.log 2>&1
        BUILD_EXIT=$?
        echo "Gradle exit code: $BUILD_EXIT"
        tail -100 $RUNNER_TEMP/debug-build.log
        set -e
        exit $BUILD_EXIT

    - name: Build Release APK
      run: |
        set +e
        ./gradlew assembleRelease --stacktrace > $RUNNER_TEMP/release-build.log 2>&1
        BUILD_EXIT=$?
        echo "Gradle exit code: $BUILD_EXIT"
        tail -100 $RUNNER_TEMP/release-build.log
        set -e
        exit $BUILD_EXIT

    - name: Verify APK existence
      run: |
        echo "=== Searching for all APK files ==="
        find $GITHUB_WORKSPACE -name '*.apk' -type f -exec ls -lh {} \; 2>/dev/null || echo 'No APK files found'
        echo "=== build/outputs structure ==="
        ls -laR $GITHUB_WORKSPACE/app/build/outputs/ 2>/dev/null || echo 'No outputs dir'

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: countbot-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: countbot-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
