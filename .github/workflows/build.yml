name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -200

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -200

    - name: Debug APK output paths
      run: |
        echo "=== GITHUB_WORKSPACE ==="
        echo $GITHUB_WORKSPACE
        echo "=== Full find ==="
        find $GITHUB_WORKSPACE -name '*.apk' -type f 2>/dev/null || echo 'NO APK FOUND'
        echo "=== app/build ==="
        ls -laR $GITHUB_WORKSPACE/app/build/ 2>/dev/null | head -50

    - name: Package and upload APKs
      run: |
        echo "=== Checking standard paths ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo 'No debug dir'
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo 'No release dir'
        echo "=== Zipping all APKs ==="
        find . -name '*.apk' -type f 2>/dev/null | zip -@ /tmp/countbot-apks.zip
        ls -lh /tmp/countbot-apks.zip

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: countbot-apks
        path: /tmp/countbot-apks.zip
        retention-days: 30
