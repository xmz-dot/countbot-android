name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "ANDROID_HOME not found"
        ls -la $ANDROID_SDK_ROOT/ 2>/dev/null || echo "ANDROID_SDK_ROOT not found"
        which sdkmanager 2>/dev/null || echo "sdkmanager not found"
        sdkmanager --list 2>/dev/null | head -20 || echo "sdkmanager failed"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -100

    - name: Build Release APK
      if: success()
      run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -100

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CountBot-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CountBot-Release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: ignore
