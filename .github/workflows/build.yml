name: Build CountBot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Show environment
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        java -version 2>&1
        echo "=== SDK root ==="
        ls $ANDROID_HOME/ 2>/dev/null | head -20
        echo "=== Build tools ==="
        ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo 'No build-tools'
        echo "=== Platforms ==="
        ls $ANDROID_HOME/platforms/ 2>/dev/null || echo 'No platforms'

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses 2>/dev/null || true

    - name: Install Android SDK components
      run: |
        sdkmanager --list 2>&1 | head -30
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        echo "=== Starting assembleDebug ==="
        ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
        EXIT=${PIPESTATUS[0]}
        echo "=== Exit code: $EXIT ==="
        echo "=== Searching for APK ==="
        find . -name '*.apk' -type f 2>/dev/null || echo 'No APK found'
        exit $EXIT

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: countbot-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
